name: CI
on:
  push:
    branches-ignore:
      - "renovate/3rd-party**" # Do not build 3rd party package updates automatically to avoid some hacked package stealing all our secrets https://securitylab.github.com/research/github-actions-preventing-pwn-requests/

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run format-check
      - run: npm run lint
      - run: npm run package
      - run: npm test

      - name: Check dist is up to date
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            echo "::error::dist/ does not match the source. Run 'npm run package' and commit dist/."
            git status --porcelain -- dist
            exit 1
          fi

      - name: Test the action
        uses: ./
        with:
          baseVersion: 1.2.3

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v6

      - name: Create the release tag
        id: vtl
        uses: ./
        with:
          baseVersion: 1.0.0
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          versionFile: ''

      - name: Move the major and latest tags, and publish the release
        if: steps.vtl.outputs.release_tag != ''
        env:
          TAG: ${{ steps.vtl.outputs.release_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          major="${TAG%%.*}"
          git tag -f "$major" "$GITHUB_SHA"
          git tag -f latest "$GITHUB_SHA"
          git push -f origin "refs/tags/$major" refs/tags/latest
          gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
