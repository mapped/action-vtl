name: CI
on:
  push:
    branches-ignore:
      - "renovate/3rd-party**" # Do not build 3rd party package updates automatically to avoid some hacked package stealing all our secrets https://securitylab.github.com/research/github-actions-preventing-pwn-requests/

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run format-check
      - run: npm run lint
      - run: npm run package
      - run: npm test

      - name: Check dist is up to date
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            echo "::error::dist/ does not match the source. Run 'npm run package' and commit dist/."
            git status --porcelain -- dist
            exit 1
          fi

      - name: Test the action
        uses: ./
        with:
          baseVersion: 1.2.3

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v6

      - name: Create the release tag
        id: vtl
        uses: ./
        with:
          baseVersion: 1.0.0
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          versionFile: ''

      - name: Move the major and latest tags, and publish the release
        if: steps.vtl.outputs.release_tag != ''
        env:
          TAG: ${{ steps.vtl.outputs.release_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          tag_sha() {
            git ls-remote origin "refs/tags/$1" "refs/tags/$1^{}" | awk '{print $1}' | tail -n 1
          }

          if [ "$(tag_sha "$TAG")" != "$GITHUB_SHA" ]; then
            echo "::warning::$TAG does not point to $GITHUB_SHA; another run created it. Leaving the tags alone."
            exit 0
          fi

          advance() {
            current="$(tag_sha "$1")"
            if [ -n "$current" ]; then
              status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$current...$GITHUB_SHA" --jq .status 2>/dev/null || echo unrelated)"
              if [ "$status" != ahead ] && [ "$status" != identical ]; then
                echo "::notice::$1 stays on $current: it is $status of $GITHUB_SHA."
                return
              fi
            fi
            git tag -f "$1" "$GITHUB_SHA"
            git push -f origin "refs/tags/$1"
          }

          advance "${TAG%%.*}"
          advance latest

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
          fi
